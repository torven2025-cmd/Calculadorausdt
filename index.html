<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT ⇄ Bs</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#6b7280;--ac:#f0b90b;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#191c21;--tx:#f2f4f7;--mu:#9aa3af;--bd:#2a2e35}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px}
.c{max-width:420px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:18px;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:none;color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:#000;border-color:var(--ac);font-weight:600}
.p{font-size:30px;font-weight:700}.m{color:var(--mu);font-size:13px;margin:2px 0 14px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input{width:100%;padding:14px;font-size:20px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.man{margin-top:16px;font-size:13px;color:var(--mu)}.man input{font-size:14px;padding:8px}
</style></head><body><div class="c">
<h1>USDT ⇄ Bolívares (Binance P2P)</h1>
<div class="tabs"><button id="b1" class="on">Comprar USDT</button><button id="b2">Vender USDT</button></div>
<div class="p" id="precio">—</div><div class="m" id="estado">Cargando precio…</div>
<label>Bolívares (Bs)</label><input id="bs" type="number" inputmode="decimal" placeholder="0.00">
<label>Dólares (USDT)</label><input id="usd" type="number" inputmode="decimal" placeholder="0.00">
<div class="man">Precio manual (si falla la conexión):<input id="man" type="number" inputmode="decimal" placeholder="Opcional"></div>
</div>
<script>
// Si usas el Worker de Cloudflare, pega aquí su URL. Si no, déjalo vacío.
const PROXY = "https://fancy-truth-204b.torven2025.workers.dev/";
const DIRECT = "https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search";
let tipo = "BUY", precio = 0, ultimo = "bs";
const $ = id => document.getElementById(id);

async function actualizar(){
  try{
    const r = await fetch(PROXY || DIRECT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({asset:"USDT",fiat:"VES",tradeType:tipo,page:1,rows:5,payTypes:[],publisherType:null,countries:[]})});
    const j = await r.json();
    const ps = j.data.map(a=>parseFloat(a.adv.price)).filter(Boolean);
    precio = ps.reduce((a,b)=>a+b,0)/ps.length;
    $("estado").textContent = "Promedio top 5 · actualizado " + new Date().toLocaleTimeString();
  }catch(e){
    $("estado").textContent = "Sin conexión a Binance. Usa el precio manual.";
  }
  render();
}
function p(){ return parseFloat($("man").value) || precio; }
function render(){
  const x = p(); $("precio").textContent = x ? x.toFixed(2)+" Bs" : "—";
  calc();
}
function calc(){
  const x = p(); if(!x) return;
  if(ultimo==="bs"){ const v=parseFloat($("bs").value); $("usd").value = v? (v/x).toFixed(2):""; }
  else { const v=parseFloat($("usd").value); $("bs").value = v? (v*x).toFixed(2):""; }
}
$("bs").oninput=()=>{ultimo="bs";calc()};
$("usd").oninput=()=>{ultimo="usd";calc()};
$("man").oninput=render;
$("b1").onclick=()=>{tipo="BUY";$("b1").className="on";$("b2").className="";actualizar()};
$("b2").onclick=()=>{tipo="SELL";$("b2").className="on";$("b1").className="";actualizar()};
actualizar(); setInterval(actualizar,30000);
</script></body></html>
